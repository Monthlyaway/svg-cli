<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect id="paper" fill="#ffffff" x="0" y="0" width="600" height="400"/>
  <text id="title" x="30" y="40">工作室平面图 / Studio</text>
  <g id="studio">
    <rect id="room" fill="#f5f8ff" stroke="#355c88" stroke-width="3" x="30" y="70" width="540" height="300"/>
    <g id="furniture">
      <g id="workstation">
        <rect id="desk" fill="#e9c399" x="91" y="120" width="200" height="90"/>
        <text id="desk-label" x="120.5" y="170">桌面 / Desk</text>
        <circle id="chair" fill="#90b8df" cx="191" cy="260" r="30"/>
      </g>
    </g>
    <line id="wall" stroke="#355c88" stroke-width="3" x1="360" y1="70" x2="360" y2="300"/>
    <g id="details">
      <ellipse id="plant" fill="#64b879" cx="490" cy="130" rx="30" ry="45"/>
    </g>
  </g>
</svg>
